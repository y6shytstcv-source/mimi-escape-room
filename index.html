<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>غرفة الهروب الدوائية</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&family=Cairo:wght@400;600;900&family=Inter:wght@400;600;900&display=swap" rel="stylesheet">
<style>
  :root {
    --green: #00ff88;
    --dark-green: #00cc66;
    --red: #ff4466;
    --blue: #00ccff;
    --yellow: #ffcc00;
    --bg: #030f0a;
    --card: #071a0f;
    --border: #00ff8833;
    --text: #e0ffe8;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }
  body.ar { font-family: 'Tajawal', sans-serif; direction: rtl; }
  body.en { font-family: 'Inter', sans-serif; direction: ltr; }

  .container { max-width: 800px; margin: 0 auto; padding: 20px; }
  .screen { display: none; }
  .screen.active { display: block; }

  .lang-bar { display: flex; justify-content: center; gap: 10px; padding-top: 10px; }
  .lang-btn { padding: 8px 20px; border-radius: 20px; cursor: pointer; border:1px solid #00ff88; }
  .lang-btn.active { background:#00ff88; color:#000; }

  .header { text-align: center; margin-top:20px; }
  .dept-name { color:#00ccff; font-weight:bold; margin-bottom:5px; }

  .start-btn, .next-btn, .restart-btn {
    width:100%; padding:15px; margin-top:10px;
    border:none; border-radius:10px; font-weight:bold; cursor:pointer;
  }
  .start-btn { background:#00ff88; color:#000; }
  .next-btn { background:#00ccff; color:#000; }
  .restart-btn { background:#ffcc00; color:#000; }

  .option-btn {
    display:block; width:100%; margin:5px 0; padding:10px;
    border-radius:10px; border:1px solid #ccc; cursor:pointer;
  }
</style>
</head>

<body class="ar">

<div class="lang-bar">
  <button class="lang-btn active" onclick="setLang('ar')">عربي</button>
  <button class="lang-btn" onclick="setLang('en')">English</button>
</div>

<div class="screen active" id="start">
  <div class="container">
    <div class="header">
      <div class="dept-name" id="dept"></div>
      <h1 id="title"></h1>
      <p id="subtitle"></p>
    </div>
    <button class="start-btn" onclick="startGame()" id="startBtn"></button>
  </div>
</div>

<div class="screen" id="game">
  <div class="container">
    <h2 id="question"></h2>
    <div id="options"></div>
    <button class="next-btn" onclick="nextQ()" id="nextBtn"></button>
  </div>
</div>

<div class="screen" id="result">
  <div class="container">
    <h2 id="resultText"></h2>
    <button class="restart-btn" onclick="location.reload()">Restart</button>
  </div>
</div>

<script>
const T = {
  ar: {
    dept: "قسم الرعاية الصيدلانيّة",
    title: "غرفة الهروب الدوائية",
    subtitle: "اختبر معلوماتك",
    start: "ابدأ",
    next: "التالي",
    result: "انتهت اللعبة"
  },
  en: {
    dept: "Pharmaceutical Care Service", // 👈 تم التعديل هنا
    title: "Pharmacy Escape Room",
    subtitle: "Test your knowledge",
    start: "Start",
    next: "Next",
    result: "Game Finished"
  }
};

let lang="ar", q=0;

const questions=[
  {
    ar:"هل جرعة Enoxaparin صحيحة مع فشل كلوي؟",
    en:"Is Enoxaparin dose correct in renal failure?",
    options_ar:["نعم","لا"],
    options_en:["Yes","No"],
    correct:1
  }
];

function setLang(l){
  lang=l;
  document.body.className=l;
  render();
}

function render(){
  document.getElementById("dept").textContent=T[lang].dept;
  document.getElementById("title").textContent=T[lang].title;
  document.getElementById("subtitle").textContent=T[lang].subtitle;
  document.getElementById("startBtn").textContent=T[lang].start;
  document.getElementById("nextBtn").textContent=T[lang].next;
}

function startGame(){
  document.getElementById("start").classList.remove("active");
  document.getElementById("game").classList.add("active");
  loadQ();
}

function loadQ(){
  let qq=questions[q];
  document.getElementById("question").textContent=qq[lang];
  let opts=lang==="ar"?qq.options_ar:qq.options_en;
  let div=document.getElementById("options");
  div.innerHTML="";
  opts.forEach((o,i)=>{
    let b=document.createElement("button");
    b.textContent=o;
    b.className="option-btn";
    b.onclick=()=>check(i);
    div.appendChild(b);
  });
}

function check(i){
  if(i===questions[q].correct){
    nextQ();
  } else {
    alert("Wrong");
  }
}

function nextQ(){
  q++;
  if(q>=questions.length){
    document.getElementById("game").classList.remove("active");
    document.getElementById("result").classList.add("active");
    document.getElementById("resultText").textContent=T[lang].result;
  } else loadQ();
}

render();
</script>

</body>
</html>
